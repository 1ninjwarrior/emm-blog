<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Em&amp;m Blog</title>
<meta name="description" content="Em&amp;m Blog: a cute diary, pinboard and life planner ♡">
<meta name="theme-color" content="#FFF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#3B2733" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Em&amp;m Blog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/png" sizes="96x96" href="img/icon-96.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&family=Patrick+Hand&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/diary.css">
<link rel="stylesheet" href="css/lists.css">
<link rel="stylesheet" href="css/today.css">
<link rel="stylesheet" href="css/garden.css">
<link rel="stylesheet" href="css/grocery.css">
<link rel="stylesheet" href="css/recipes-extra.css">
<link rel="stylesheet" href="css/me-data.css">
<link rel="stylesheet" href="css/calm.css">
<script>
  /* Set light/dark + look before first paint so there is no flash. */
  (function () {
    var r = document.documentElement;
    try {
      if (localStorage.getItem('emm-mode') === 'dark') r.setAttribute('data-emm', 'dark');
      if (localStorage.getItem('emm-flowers') === 'on') r.setAttribute('data-flowers', 'on');
      var look = localStorage.getItem('emm-look-now');
      if (look && look !== 'pink') r.setAttribute('data-look', look);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="flowers" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="fl-bloom" viewBox="-50 -50 100 100">
        <g fill="currentColor">
          <ellipse cx="0" cy="-24" rx="15" ry="22"/>
          <ellipse cx="0" cy="-24" rx="15" ry="22" transform="rotate(72)"/>
          <ellipse cx="0" cy="-24" rx="15" ry="22" transform="rotate(144)"/>
          <ellipse cx="0" cy="-24" rx="15" ry="22" transform="rotate(216)"/>
          <ellipse cx="0" cy="-24" rx="15" ry="22" transform="rotate(288)"/>
        </g>
        <circle r="11" style="fill:var(--mid,#FFF3B8)"/>
        <circle r="4" cx="-3" cy="-3" fill="#fff" opacity=".6"/>
      </symbol>
      <symbol id="fl-daisy" viewBox="-50 -50 100 100">
        <g fill="#FFFFFF" stroke="currentColor" stroke-width="2">
          <ellipse cx="0" cy="-27" rx="7" ry="18"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(40)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(80)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(120)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(160)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(200)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(240)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(280)"/>
          <ellipse cx="0" cy="-27" rx="7" ry="18" transform="rotate(320)"/>
        </g>
        <circle r="10" style="fill:var(--mid,#FFD66B)"/>
      </symbol>
      <symbol id="fl-tulip" viewBox="-50 -50 100 100">
        <path d="M0 44 C0 20 2 8 0 -2" stroke="#8CC79B" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M0 30 C-16 24 -22 12 -20 4 C-10 8 -3 16 0 26Z" fill="#9FD3AC"/>
        <path d="M-18 -30 L-9 -18 L0 -34 L9 -18 L18 -30 C22 -8 14 4 0 4 C-14 4 -22 -8 -18 -30Z" fill="currentColor"/>
      </symbol>
      <symbol id="fl-leaf" viewBox="-50 -50 100 100">
        <path d="M-36 30 C-30 -6 -4 -30 34 -34 C30 4 4 30 -36 30Z" fill="#A8D8B4"/>
        <path d="M-34 28 C-14 8 6 -12 30 -30" stroke="#86C095" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </symbol>
      <symbol id="fl-heart" viewBox="-50 -50 100 100">
        <path d="M0 34 C-40 8 -38 -26 -18 -30 C-8 -32 -2 -24 0 -18 C2 -24 8 -32 18 -30 C38 -26 40 8 0 34Z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>
</div>

<div class="app" id="app">
  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <a class="rail-brand" href="#home" aria-label="Em&amp;m Blog home"><img src="img/icon-96.png" alt="" width="44" height="44"><span>Em<i>&amp;</i>m</span></a>
    <button type="button" class="tab" id="tab-home" data-tab="home" aria-label="Home">
      <img src="img/icons/tab-home.png" alt="" width="30" height="30"><span>Home</span>
    </button>
    <button type="button" class="tab" id="tab-today" data-tab="today" aria-label="Today">
      <img src="img/icons/tab-today.png" alt="" width="30" height="30"><span>Today</span>
    </button>
    <button type="button" class="tab create" id="tab-create" data-tab="create" aria-label="Make something" aria-haspopup="dialog">
      <span class="plus" aria-hidden="true"><img src="img/icons/tab-create.png" alt="" width="58" height="58"></span><span class="lbl-create">Create</span>
    </button>
    <button type="button" class="tab" id="tab-lists" data-tab="lists" aria-label="Lists">
      <img src="img/icons/tab-lists.png" alt="" width="30" height="30"><span>Lists</span>
    </button>
    <button type="button" class="tab" id="tab-diary" data-tab="diary" aria-label="Diary">
      <img src="img/icons/tab-diary.png" alt="" width="30" height="30"><span>Diary</span>
    </button>
    <button type="button" class="tab rail-only" id="tab-me" data-tab="me" aria-label="Settings">
      <img src="img/icons/tab-me.png" alt="" width="30" height="30"><span>Me</span>
    </button>
  </nav>

  <main class="views" id="views">
    <section class="view" id="view-home" data-view="home" aria-label="Home"></section>
    <section class="view" id="view-today" data-view="today" aria-label="Today" hidden></section>
    <section class="view" id="view-lists" data-view="lists" aria-label="Lists" hidden></section>
    <section class="view" id="view-diary" data-view="diary" aria-label="Diary" hidden></section>
    <section class="view" id="view-me" data-view="me" aria-label="Me" hidden></section>
  </main>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<script type="module" src="js/main.js"></script>
</body>
</html>
